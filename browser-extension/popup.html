<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Save to Keepfor.me</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      color: #1f2937;
      background: #ffffff;
      box-sizing: border-box;
    }
    h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .gear { cursor: pointer; opacity: 0.6; font-size: 14px; text-decoration: none; color: inherit; }
    .gear:hover { opacity: 1; }
    label { font-size: 11px; text-transform: uppercase; font-weight: 600; color: #6b7280; display: block; margin-top: 8px; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      padding: 7px 9px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
    }
    input[type="text"]:focus { border-color: #2563eb; ring: 2px solid #93c5fd; }
    .btn {
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #1e293b; }
    .status { margin-top: 10px; font-size: 12px; text-align: center; font-weight: 500; min-height: 18px; }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .config-view { display: none; }
    .config-view.active { display: block; }
    .main-view.hidden { display: none; }
  </style>
</head>
<body>
  <div id="main-view" class="main-view">
    <h2>
      <span>Keepfor.me</span>
      <a href="#" id="toggle-config" class="gear" title="Settings">⚙️</a>
    </h2>
    <label>URL</label>
    <input type="text" id="url-input" readonly />
    
    <label>Title</label>
    <input type="text" id="title-input" />
    
    <label>Tags (comma separated)</label>
    <input type="text" id="tags-input" placeholder="tech, ai, reading" />

    <button id="save-btn" class="btn">Save Link</button>
    <div id="status" class="status"></div>
    <div id="ext-links" style="display:flex;gap:8px;margin-top:10px;font-size:12px;">
      <a href="#" id="open-library">Open library ↗</a>
      <a href="#" id="open-panel" style="margin-left:auto">Bulk / history →</a>
    </div>
    <div id="dupe" class="status"></div>
  </div>

  <div id="config-view" class="config-view">
    <h2>
      <span>Settings</span>
      <a href="#" id="close-config" class="gear" title="Back">⬅️</a>
    </h2>
    <label>Worker URL</label>
    <input type="text" id="worker-url" placeholder="https://keepfor.me" />
    
    <label>Personal Access Token (PAT)</label>
    <input type="text" id="pat-token" placeholder="kfm_live_..." />

    <button id="save-config-btn" class="btn">Save Settings</button>
    <div id="config-status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
