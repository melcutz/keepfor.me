<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Save to Keepfor.me</title>
  <style>
    :root {
      --bg: #fcfbf8;
      --card-bg: #ffffff;
      --border: #e7e3da;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #1e3a2f;
      --accent-hover: #152921;
      --btn-text: #ffffff;
      --focus-ring: rgba(30, 58, 47, 0.2);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --card-bg: #1c1b1a;
        --border: #2d2b29;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #10b981;
        --accent-hover: #059669;
        --btn-text: #09090b;
        --focus-ring: rgba(16, 185, 129, 0.25);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      color: var(--text);
      background: var(--bg);
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .gear {
      cursor: pointer;
      opacity: 0.7;
      text-decoration: none;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: opacity 0.15s, color 0.15s;
    }
    .gear:hover { opacity: 1; color: var(--text); }
    label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--muted);
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }
    input[type="text"][readonly] {
      opacity: 0.75;
      background: transparent;
    }
    .btn {
      width: 100%;
      margin-top: 14px;
      padding: 8px 12px;
      background: var(--accent);
      color: var(--btn-text);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, transform 0.05s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: 500;
      min-height: 18px;
    }
    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .ext-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 11px;
    }
    .ext-links a {
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .ext-links a:hover { color: var(--text); }
    .config-view { display: none; }
    .config-view.active { display: block; }
    .main-view.hidden { display: none; }
  </style>
</head>
<body>
  <div id="main-view" class="main-view">
    <h2>
      <span class="brand-title">
        <svg width="16" height="16" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="kfm-pop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="2" y="2" width="40" height="40" rx="11" fill="url(#kfm-pop)"/><path d="M17 11h10v16l-5-3.8-5 3.8z" fill="#fff"/></svg>
        <span>Keepfor.me</span>
      </span>
      <a href="#" id="toggle-config" class="gear" title="Settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </h2>
    <label>URL</label>
    <input type="text" id="url-input" readonly />
    
    <label>Title</label>
    <input type="text" id="title-input" />
    
    <label>Tags (comma separated)</label>
    <input type="text" id="tags-input" placeholder="tech, ai, reading" />

    <button id="save-btn" class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span>Save Link</span>
    </button>
    <div id="status" class="status"></div>
    <div id="ext-links" class="ext-links">
      <a href="#" id="open-library">
        <span>Open library</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </a>
      <a href="#" id="open-panel">
        <span>Side panel</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </div>
    <div id="dupe" class="status"></div>
  </div>

  <div id="config-view" class="config-view">
    <h2>
      <span>Settings</span>
      <a href="#" id="close-config" class="gear" title="Back" aria-label="Back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
    </h2>
    <label>Worker URL</label>
    <input type="text" id="worker-url" placeholder="https://app.keepfor.me" />
    
    <label>Personal Access Token (PAT)</label>
    <input type="text" id="pat-token" placeholder="kfm_live_..." />

    <button id="save-config-btn" class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <span>Save Settings</span>
    </button>
    <div id="config-status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
