{% extends "base.html" %}

{% block title %}Log in — Keepfor.me{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center p-4">
  <div class="bg-white border border-slate-200 shadow-sm rounded-xl max-w-sm w-full p-8">
    <div class="text-center mb-6">
      <div class="flex items-center justify-center gap-2 text-xl">
        <svg width="26" height="26" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="kfm-login" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="2" y="2" width="40" height="40" rx="11" fill="url(#kfm-login)"/><path d="M17 11h10v16l-5-3.8-5 3.8z" fill="#fff"/></svg>
        <span class="font-extrabold tracking-[-0.03em] text-slate-900">Keepfor<span class="text-blue-600">.me</span></span>
      </div>
      <p class="text-xs text-slate-500 mt-2">Sign in to your personal read-it-later library</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg">
      {{ error }}
    </div>
    {% endif %}

    <form action="/auth/login" method="POST" class="space-y-4">
      {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <div>
        <label class="block text-sm font-semibold uppercase text-slate-500 mb-1">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-slate-900">
      </div>
      <div>
        <label class="block text-sm font-semibold uppercase text-slate-500 mb-1">Password</label>
        <input type="password" name="password" required 
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-slate-900">
      </div>
      <button type="submit" class="w-full py-2 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition">
        Log in
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
      Need to set up your instance? <a href="/auth/register{% if next %}?next={{ next }}{% endif %}" class="text-slate-900 font-semibold hover:underline">Register</a>
    </div>
  </div>
</div>
{% endblock %}
