{% extends "base.html" %}

{% block title %}Log in — Keepfor.me{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center p-4">
  <div class="bg-white border border-slate-200 shadow-sm rounded-xl max-w-sm w-full p-8">
    <div class="text-center mb-6">
      <span class="text-3xl">📚</span>
      <h2 class="text-xl font-bold text-slate-900 mt-2">Welcome to Keepfor.me</h2>
      <p class="text-xs text-slate-500 mt-1">Sign in to your personal read-it-later library</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg">
      {{ error }}
    </div>
    {% endif %}

    <form action="/auth/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
        <input type="password" name="password" required 
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
      </div>
      <button type="submit" class="w-full py-2 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition">
        Log in
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
      Need to set up your instance? <a href="/auth/register" class="text-slate-900 font-semibold hover:underline">Register</a>
    </div>
  </div>
</div>
{% endblock %}
