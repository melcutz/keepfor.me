<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Save to Keepfor.me</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f8fafc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keepfor.me">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior-y: contain; }
    /* 16px floor on form fields: readable on phones and stops iOS
       Safari's auto-zoom on focus (<16px inputs trigger it). */
    input, select, textarea { font-size: 16px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-dvh flex items-end sm:items-center justify-center sm:p-6">
  <div class="w-full sm:max-w-md mx-auto bg-white border border-slate-200 rounded-t-2xl sm:rounded-xl p-6 shadow-sm" style="padding-bottom: max(2rem, calc(env(safe-area-inset-bottom) + 1.25rem));">
    <div class="flex items-center space-x-2 mb-4">
      <svg width="22" height="22" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="kfm-popup" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="2" y="2" width="40" height="40" rx="11" fill="url(#kfm-popup)"/><path d="M17 11h10v16l-5-3.8-5 3.8z" fill="#fff"/></svg>
      <h2 class="text-base font-extrabold tracking-[-0.03em] text-slate-900">Keepfor<span class="text-blue-600">.me</span></h2>
    </div>

    {% if success %}
    {% if source == 'share' %}
    <div class="py-6 text-center">
      <div class="w-10 h-10 mx-auto rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mb-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <p class="font-semibold text-base text-slate-900">Saved to your library!</p>
      <p class="text-xs text-slate-500 mt-1">You can head back to your app.</p>
      <a href="/" class="inline-block mt-4 text-xs font-semibold text-blue-600 hover:underline">Open library →</a>
    </div>
    {% else %}
    <div class="py-6 text-center">
      <div class="w-10 h-10 mx-auto rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mb-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <p class="font-semibold text-base text-slate-900">Saved &amp; Queued!</p>
      <p class="text-xs text-slate-500 mt-1">Taking you back to your library…</p>
    </div>
    <script>
      // Bookmarklet popups (window.open) can close themselves; share-target
      // and PWA pages cannot, so fall back to the library if still open.
      setTimeout(() => {
        window.close();
        setTimeout(() => { location.href = '/'; }, 400);
      }, 1200);
    </script>
    {% endif %}
    {% else %}
    <form id="share-save-form" action="/save-popup" method="POST" class="space-y-4">
      <input type="hidden" name="source" value="{{ source|default('') }}">
      <div>
        <label for="save-popup-url" class="block text-sm font-semibold uppercase text-slate-500 mb-1">URL</label>
        <input type="url" id="save-popup-url" name="url" value="{{ url }}" required readonly
               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-base text-slate-600">
      </div>
      <div>
        <label for="save-popup-title" class="block text-sm font-semibold uppercase text-slate-500 mb-1">Title</label>
        <input type="text" id="save-popup-title" name="title" value="{{ title }}"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-slate-900">
      </div>
      <div>
        <label for="tags-input" class="block text-sm font-semibold uppercase text-slate-500 mb-1">Tags (comma separated)</label>
        <input type="text" name="tags" placeholder="tech, news, reading" autofocus list="tag-suggest-all" id="tags-input" autocomplete="off"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-slate-900">
        <datalist id="tag-suggest-all"></datalist>
        {% if recent_tags %}
        <div class="flex flex-wrap gap-1.5 mt-2">
          {% for rt in recent_tags %}
          <button type="button" data-recent-tag="{{ rt }}"
                  class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-medium hover:bg-slate-200">#{{ rt }}</button>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      <script>
      (function () {
        var input = document.getElementById('tags-input');
        var list = document.getElementById('tag-suggest-all');
        if (!input || !list) return;
        input.addEventListener('input', function () {
          var parts = input.value.split(',');
          var q = parts[parts.length - 1].trim();
          fetch('/tags/suggest?q=' + encodeURIComponent(q) + '&exclude=' + encodeURIComponent(parts.slice(0, -1).join(',')))
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (items) {
              list.innerHTML = '';
              items.forEach(function (it) {
                var o = document.createElement('option');
                o.value = it.name;
                list.appendChild(o);
              });
            }).catch(function () {});
        });
        document.querySelectorAll('[data-recent-tag]').forEach(function (b) {
          b.addEventListener('click', function () {
            var cur = input.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            if (!cur.includes(b.getAttribute('data-recent-tag'))) cur.push(b.getAttribute('data-recent-tag'));
            input.value = cur.join(', ');
            input.focus();
          });
        });
      })();
      </script>
      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" onclick="cancelShareSave()"
                class="px-4 py-2.5 sm:py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
        <button type="submit" id="share-save-submit"
                class="px-4 py-2.5 sm:py-2 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 disabled:opacity-60">Save to Library</button>
      </div>
    </form>
    <script>
      // window.close() is a no-op in PWA / share-target contexts. Going back
      // leaves the app; with no history entries, fall back to the library.
      function cancelShareSave() {
        if ("{{ source|default('') }}" !== "share") { window.close(); return; }
        if (history.length > 1) history.back();
        else location.href = "/";
      }
      {% if source == 'share' %}
      // Submit via fetch, then location.replace() the form history entry with
      // the success page: swipe-back exits the PWA instead of resurrecting
      // the just-submitted form. No-JS clients fall back to a native submit.
      document.getElementById("share-save-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const form = e.target;
        const btn = document.getElementById("share-save-submit");
        btn.disabled = true;
        btn.textContent = "Saving…";
        fetch(form.action, { method: "POST", body: new FormData(form) }).then((r) => {
          if (!r.ok) throw new Error("save failed: " + r.status);
          const url = form.querySelector('input[name="url"]').value;
          location.replace("/share/saved?" + new URLSearchParams({ url }));
        }).catch(() => {
          // Server rejected it: fall back to a native submit so the error
          // surfaces instead of failing silently.
          btn.disabled = false;
          btn.textContent = "Save to Library";
          form.submit();
        });
      });
      {% endif %}
    </script>
    {% endif %}
  </div>
</body>
</html>
