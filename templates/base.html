<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Keepfor.me — Personal Library{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    [x-cloak] { display: none !important; }
    /* Sepia theme styles */
    .theme-sepia { background-color: #fbf0d9 !important; color: #5f4b32 !important; }
    .theme-sepia article { color: #433422 !important; }
    .theme-sepia .reader-card { background-color: #f4e7cb !important; border-color: #ebd7b2 !important; }
    /* Dark theme styles */
    .theme-dark { background-color: #0f172a !important; color: #cbd5e1 !important; }
    .theme-dark article { color: #e2e8f0 !important; }
    .theme-dark .reader-card { background-color: #1e293b !important; border-color: #334155 !important; }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f8fafc', 500: '#0f172a', 600: '#020617' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col font-sans">
  {% if current_user %}
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200 px-4 sm:px-8 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-6">
      <a href="/" class="flex items-center space-x-2 text-slate-900 font-extrabold tracking-[-0.03em] text-lg">
        <svg width="22" height="22" viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="kfm-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect x="2" y="2" width="40" height="40" rx="11" fill="url(#kfm-base)"/><path d="M17 11h10v16l-5-3.8-5 3.8z" fill="#fff"/></svg>
        <span>Keepfor<span class="text-blue-600">.me</span></span>
      </a>
      <nav class="hidden md:flex items-center space-x-4 text-sm font-medium text-slate-600">
        <a href="/" class="hover:text-slate-900 transition">Library</a>
        <a href="/settings" class="hover:text-slate-900 transition">Settings & API</a>
      </nav>
    </div>

    <div class="flex items-center space-x-3">
      <button onclick="document.getElementById('save-modal').classList.remove('hidden')" 
              class="inline-flex items-center space-x-1.5 px-3 py-1.5 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition shadow-sm">
        <span>+ Save Link</span>
        <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-xs bg-slate-700 text-slate-300 rounded">S</kbd>
      </button>

      <span class="text-xs text-slate-400 hidden sm:inline">{{ current_user.email }}</span>
      <a href="/auth/logout" class="text-xs text-slate-500 hover:text-red-600 transition font-medium">Log out</a>
    </div>
  </header>
  {% endif %}

  <main class="flex-1 overflow-y-auto">
    {% block content %}{% endblock %}
  </main>

  <!-- Quick Save Modal -->
  {% if current_user %}
  <div id="save-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md p-6 relative">
      <button onclick="document.getElementById('save-modal').classList.add('hidden')" 
              class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      <h3 class="text-base font-semibold text-slate-900 mb-4">Save Link to Library</h3>
      
      <form action="/save" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Webpage URL</label>
          <input type="url" name="url" required autofocus placeholder="https://example.com/article" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tags (comma separated)</label>
          <input type="text" name="tags" placeholder="ai, research, design" 
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="document.getElementById('save-modal').classList.add('hidden')" 
                  class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
          <button type="submit" 
                  class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800">Save Link</button>
        </div>
      </form>
    </div>
  </div>
  {% endif %}

  <script>
    // Global keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 's' || e.key === 'S') {
        const modal = document.getElementById('save-modal');
        if (modal) {
          e.preventDefault();
          modal.classList.toggle('hidden');
        }
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      }
    });
  </script>
</body>
</html>
