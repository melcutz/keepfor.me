{% from "partials/icons.html" import icon %}
{% set sc = status_counts or {'all': 0, 'saved': 0, 'extracting': 0, 'failed': 0} %}
<button data-status=""
        hx-post="/search"
        hx-target="#items-list"
        hx-include="#search-input, #active-tag-input, #active-status-input, #active-page-input, #active-perpage-input, #active-category-input, #active-quick-input"
        onclick="document.getElementById('active-page-input').value='1';document.getElementById('active-status-input').value='';document.querySelectorAll('#status-filters button').forEach(b=>{b.className='shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300';b.setAttribute('aria-pressed','false');});this.className='shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-white';this.setAttribute('aria-pressed','true');"
        aria-pressed="{% if not active_status %}true{% else %}false{% endif %}"
        class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium {% if not active_status %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:border-slate-300{% endif %}">All · {{ sc.all }}</button>
<button data-status="saved"
        hx-post="/search"
        hx-target="#items-list"
        hx-include="#search-input, #active-tag-input, #active-status-input, #active-page-input, #active-perpage-input, #active-category-input, #active-quick-input"
        onclick="document.getElementById('active-page-input').value='1';document.getElementById('active-status-input').value='saved';document.querySelectorAll('#status-filters button').forEach(b=>{b.className='shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300';b.setAttribute('aria-pressed','false');});this.className='shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-white';this.setAttribute('aria-pressed','true');"
        aria-pressed="{% if active_status == 'saved' %}true{% else %}false{% endif %}"
        class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium {% if active_status == 'saved' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:border-slate-300{% endif %}">{{ icon("book-open", class="w-3.5 h-3.5") }}<span>Saved · {{ sc.saved }}</span></button>
<button data-status="extracting"
        hx-post="/search"
        hx-target="#items-list"
        hx-include="#search-input, #active-tag-input, #active-status-input, #active-page-input, #active-perpage-input, #active-category-input, #active-quick-input"
        onclick="document.getElementById('active-page-input').value='1';document.getElementById('active-status-input').value='extracting';document.querySelectorAll('#status-filters button').forEach(b=>{b.className='shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300';b.setAttribute('aria-pressed','false');});this.className='shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-white';this.setAttribute('aria-pressed','true');"
        aria-pressed="{% if active_status == 'extracting' %}true{% else %}false{% endif %}"
        class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium {% if active_status == 'extracting' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:border-slate-300{% endif %}">{{ icon("clock", class="w-3.5 h-3.5") }}<span>Extracting · {{ sc.extracting }}</span></button>
<button data-status="failed"
        hx-post="/search"
        hx-target="#items-list"
        hx-include="#search-input, #active-tag-input, #active-status-input, #active-page-input, #active-perpage-input, #active-category-input, #active-quick-input"
        onclick="document.getElementById('active-page-input').value='1';document.getElementById('active-status-input').value='failed';document.querySelectorAll('#status-filters button').forEach(b=>{b.className='shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:border-slate-300';b.setAttribute('aria-pressed','false');});this.className='shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-white';this.setAttribute('aria-pressed','true');"
        aria-pressed="{% if active_status == 'failed' %}true{% else %}false{% endif %}"
        class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium {% if active_status == 'failed' %}bg-slate-900 text-white{% else %}bg-white border border-slate-200 text-slate-600 hover:border-slate-300{% endif %}">{{ icon("alert", class="w-3.5 h-3.5") }}<span>Failed · {{ sc.failed }}</span></button>
