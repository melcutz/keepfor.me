[project]
name = "keepfor-me"
version = "1.1.1"
description = "Thin read-it-later and personal library on Cloudflare Python Workers with MCP for keepfor.me"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.4",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.3",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "bandit>=1.7.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keepfor"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "keepfor/templates"
"static" = "keepfor/static"
"migrations" = "keepfor/migrations"
