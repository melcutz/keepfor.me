name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # wrangler@4.147.0 requires Node >= 22
          node-version: '22'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      
      - name: Install Node dependencies
        # Pinned: wrangler 4.86.0 hard-errors on our intentional Text-rule
        # shadowing ("matched a module rule ... not marked as fallthrough"),
        # which is what keeps ~6.4 MiB of venv .txt out of the bundle.
        # Upstream workers-sdk#14257, fixed in later 4.x (4.147.0 verified:
        # shadowed files are silently skipped, dry-run passes at 4475
        # modules / ~52,500 KiB). Do NOT float this back to latest.
        run: npm install -g wrangler@4.147.0
      
      - name: Verify wrangler config and bundle size
        run: |
          set -o pipefail
          uvx --from workers-py pywrangler deploy --dry-run 2>&1 | tee /tmp/dryrun.txt
          KIB=$(grep -E 'Total \([0-9]+ modules\)' /tmp/dryrun.txt | tail -1 | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          MODS=$(grep -oE 'Total \([0-9]+ modules\)' /tmp/dryrun.txt | grep -oE '[0-9]+' | head -1)
          if [ -z "$KIB" ]; then
            echo "::error::Could not parse the module table from the dry run"
            exit 1
          fi
          echo "bundle: ${KIB} KiB across ${MODS} modules"
          LIMIT=58000
          awk -v k="$KIB" -v l="$LIMIT" 'BEGIN{ if (k+0 > l+0) { print "::error::Worker bundle " k " KiB exceeds the " l " KiB budget"; exit 1 } }'
          if grep -q '\.venv-workers' /tmp/dryrun.txt; then
            echo "::warning::The build venv .venv-workers is still being bundled. Cloudflare rejects the Worker above 64 MiB. See the 'Bundle size' section of AGENTS.md."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Deploy to Cloudflare
        run: uvx --from workers-py pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Post-deploy smoke test
        run: |
          # Probe the routed custom domain. The bare apex (keepfor.me) has no
          # DNS record and always returns 000, so testing it proved nothing.
          BASE="https://app.keepfor.me"

          # GET / runs a D1 query (users COUNT) before redirecting to login, so
          # this catches a broken D1 binding, not just an unreachable edge.
          # Retry because a fresh version needs a moment to propagate.
          OK=""
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/" || echo "000")
            if [ "$CODE" = "200" ] || [ "$CODE" = "303" ]; then
              OK="$CODE"
              break
            fi
            echo "attempt $i: / returned $CODE, retrying..."
            sleep 10
          done

          if [ -z "$OK" ]; then
            echo "::error::$BASE/ never returned 200 or 303 (last: $CODE)"
            exit 1
          fi
          echo "landing page: $OK"

          # The PWA manifest must be served for install/share to work.
          MANIFEST=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "$BASE/manifest.webmanifest" || echo "000")
          if [ "$MANIFEST" != "200" ]; then
            echo "::error::manifest.webmanifest returned $MANIFEST"
            exit 1
          fi
          echo "✅ Smoke test passed - app, D1, and PWA manifest responding"

  slack-notify:
    runs-on: ubuntu-latest
    name: Notify Slack (Optional)
    needs: deploy
    if: always()
    steps:
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
